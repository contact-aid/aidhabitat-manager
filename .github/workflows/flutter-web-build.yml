name: Build Flutter Web

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API URL baked into the Flutter web bundle"
        required: false
        default: "https://api.aidhabitat.fr"
      upload_artifact:
        description: "Upload build/web as a short-lived artifact"
        required: false
        type: boolean
        default: true
      publish_image:
        description: "Publish a prebuilt nginx image to GitHub Container Registry"
        required: false
        type: boolean
        default: false
      image_tag:
        description: "Container tag; use latest only for an explicit production publication"
        required: false
        default: "staging"
      deploy_staging:
        description: "Trigger Easypanel web staging after publishing the image"
        required: false
        type: boolean
        default: false
      expected_build_number:
        description: "Required for image publication; must match version.json"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: flutter-web-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify successful native tests for the identical application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code 136c727a17056bfe92318ce195d5ca113a1ffa49 HEAD -- . ':!.github/workflows/flutter-web-build.yml'
          gh api repos/contact-aid/aidhabitat-manager/actions/runs/41687479916 > /tmp/verified-native-run.json
          git show 136c727a17056bfe92318ce195d5ca113a1ffa49:.github/workflows/sync-integrity.yml > /tmp/verified-native-workflow.yml
          gh api repos/contact-aid/aidhabitat-manager/actions/runs/41687479916/jobs > /tmp/verified-native-jobs.json
          node --input-type=module -e '
            import fs from "node:fs";
            const run = JSON.parse(fs.readFileSync("/tmp/verified-native-run.json"));
            if (run.head_sha !== "136c727a17056bfe92318ce195d5ca113a1ffa49" ||
                run.name !== "Sync Integrity" || run.status !== "completed" ||
                run.conclusion !== "success") throw Error("Matching native test evidence required");
            const workflow = fs.readFileSync("/tmp/verified-native-workflow.yml", "utf8");
            if (!workflow.includes("run: bash aid_habitat_app/tool/test_sync_critical.sh"))
              throw Error("Critical native suite must be part of the tested workflow");
            const jobs = JSON.parse(fs.readFileSync("/tmp/verified-native-jobs.json")).jobs;
            if (!jobs.some(job => job.conclusion === "success" && job.steps.some(step =>
                step.name === "Verify critical synchronization scenarios" && step.conclusion === "success")))
              throw Error("Successful critical native test step required");
            console.log("Native test evidence verified for identical application source:", run.html_url);
          '

  build-web:
    needs: native-tests
    name: Build online-first web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: aid_habitat_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify application contracts
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          npm run test:sync-contract
          npm run check:critical
          node --test tools/test-voice-*.mjs
          node --test tools/release-artifact-check.test.mjs tools/publication-workflows.test.mjs tools/web-release-manifest.test.mjs tools/check-web-release.test.mjs
          npm run test:pdf

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: false

      - name: Build Flutter web
        env:
          AIDHABITAT_API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          chmod +x ./tool/build_web.sh
          ./tool/build_web.sh

      - name: Check web bundle
        working-directory: .
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          EXPECTED_BUILD_NUMBER: ${{ inputs.expected_build_number }}
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
        run: |
          if [ "$PUBLISH_IMAGE" = "true" ] && [ -z "$EXPECTED_BUILD_NUMBER" ]; then
            echo "::error::expected_build_number is required when publish_image=true."
            exit 1
          fi
          node tools/web-release-manifest.mjs write \
            --dir aid_habitat_app/build/web \
            --git-sha "${{ github.sha }}" \
            --api-base-url "$API_BASE_URL"
          args=(--dir aid_habitat_app/build/web --expected-git-sha "${{ github.sha }}")
          if [ -n "$EXPECTED_BUILD_NUMBER" ]; then
            args+=(--expected-build-number "$EXPECTED_BUILD_NUMBER")
          fi
          npm run release:web-check -- "${args[@]}"

      - name: Validate web publication decision
        working-directory: .
        env:
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
          DEPLOY_STAGING: ${{ inputs.deploy_staging }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$DEPLOY_STAGING" = "true" ] && [ "$PUBLISH_IMAGE" != "true" ]; then
            echo "::error::deploy_staging=true requires publish_image=true."
            exit 1
          fi
          if [ "$DEPLOY_STAGING" = "true" ]; then
            node tools/release-artifact-check.mjs assert-staging-tag "$IMAGE_TAG"
          fi

      - name: Validate web staging prerequisite
        if: ${{ inputs.deploy_staging }}
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_WEB_STAGING_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "::error::Missing EASYPANEL_WEB_STAGING_DEPLOY_URL; no image has been published."
            exit 1
          fi

      - name: Publish prebuilt nginx image
        if: ${{ inputs.publish_image }}
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aidhabitat-web
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_STAGING: ${{ inputs.deploy_staging }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag_output="$(node ../tools/release-artifact-check.mjs web-tags \
            "$IMAGE_NAME" "$IMAGE_TAG" "${{ github.sha }}")"
          mapfile -t image_refs <<< "$tag_output"
          tags=()
          for image_ref in "${image_refs[@]}"; do
            tags+=(-t "$image_ref")
          done
          docker build -f Dockerfile.web "${tags[@]}" .
          for image_ref in "${image_refs[@]}"; do
            docker push "$image_ref"
          done

      - name: Trigger Easypanel web staging
        if: ${{ inputs.publish_image && inputs.deploy_staging }}
        working-directory: .
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_WEB_STAGING_DEPLOY_URL }}
        run: |
          node tools/release-artifact-check.mjs post-webhook EASYPANEL_DEPLOY_URL

      - name: Upload web artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: aidhabitat-web-${{ github.sha }}
          path: aid_habitat_app/build/web
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Publication summary
        working-directory: .
        env:
          EXPECTED_BUILD_NUMBER: ${{ inputs.expected_build_number || 'not asserted' }}
        run: |
          echo "## Web candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected build: \`$EXPECTED_BUILD_NUMBER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image publication requested: \`${{ inputs.publish_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging deployment requested: \`${{ inputs.deploy_staging }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment target: verify the service behind the configured webhook; its name does not guarantee isolation from production" >> "$GITHUB_STEP_SUMMARY"
