# ---------------------------------------------------------------------------
# GitHub Actions — build & deploy du backend Express (API + génération PDF).
#
# Chaque push serveur valide et construit l'image sans la publier. Publication
# et déploiement sont des décisions manuelles explicites : cela évite de
# remplacer `latest` avant de découvrir qu'un prérequis de déploiement manque.
#
# Beaucoup plus rapide que le build web (pas de Flutter SDK à installer)
# — typiquement ~1 min avec cache, ~3 min cold.
#
# Secrets requis (à configurer sur GitHub → repo → Settings → Secrets):
#   - EASYPANEL_API_WEBHOOK : URL du webhook du service API réellement vérifié.
#       Obligatoire uniquement quand `deploy_api=true`.
# Variable optionnelle API_HEALTH_BASE_URL : origine HTTPS publique de l'API
#   (sans identifiants, chemin ni query), par defaut https://api.aidhabitat.fr.
# Le webhook accepte ne suffit pas : SHA actif attendu + readiness sont verifies.
#
# Permissions : `packages: write` pour push sur ghcr.io.
# ---------------------------------------------------------------------------

name: Build & Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.api'
      - '.dockerignore'
      - 'tools/release-artifact-check.mjs'
      - 'tools/release-artifact-check.test.mjs'
      - 'tools/wait-api-readiness.mjs'
      - 'tools/wait-api-readiness.test.mjs'
      - 'tools/api-health-version.test.mjs'
      - '.github/workflows/build-deploy-api.yml'
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publish the validated API image to GHCR"
        required: false
        type: boolean
        default: false
      deploy_api:
        description: "Trigger the verified Easypanel API webhook and verify the live SHA"
        required: false
        type: boolean
        default: false
      image_tag:
        description: "Explicit GHCR channel; use latest only after confirming Easypanel follows it"
        required: false
        default: "candidate"

concurrency:
  group: api-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-build-and-optional-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 1. Sanity check : `node --check` sur le serveur avant de builder
      # --------------------------------------------------------------
      # Évite de pousser une image avec une erreur de syntaxe — économise
      # un cycle complet build/push/deploy pour rien.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify synchronization contracts
        run: npm run test:sync-contract

      - name: Verify server regressions
        run: npm run test:server

      - name: Verify critical flows
        run: npm run check:critical

      - name: Verify release safeguards
        run: node --test tools/release-artifact-check.test.mjs tools/publication-workflows.test.mjs tools/wait-api-readiness.test.mjs tools/api-health-version.test.mjs

      - name: Validate API health target
        env:
          API_HEALTH_BASE_URL: ${{ vars.API_HEALTH_BASE_URL || 'https://api.aidhabitat.fr' }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node tools/wait-api-readiness.mjs validate

      - name: Syntax check server
        run: |
          for f in server/index.mjs server/helpers.mjs server/nocodbMcpClient.mjs server/mobileSyncStore.mjs server/routes/feedback.mjs; do
            echo "Checking $f…"
            node --check "$f"
          done

      - name: Validate publication decision
        env:
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
          DEPLOY_API: ${{ inputs.deploy_api }}
          IMAGE_TAG: ${{ inputs.image_tag || 'candidate' }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid image_tag."
            exit 1
          fi
          if [ "$DEPLOY_API" = "true" ] && [ "$PUBLISH_IMAGE" != "true" ]; then
            echo "::error::deploy_api=true requires publish_image=true."
            exit 1
          fi

      - name: Validate API deployment prerequisite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_api }}
        env:
          EASYPANEL_WEBHOOK: ${{ secrets.EASYPANEL_API_WEBHOOK }}
        run: |
          if [ -z "$EASYPANEL_WEBHOOK" ]; then
            echo "::error::Missing EASYPANEL_API_WEBHOOK; no image has been published."
            exit 1
          fi

      # --------------------------------------------------------------
      # 2. Login sur GitHub Container Registry (ghcr.io)
      # --------------------------------------------------------------
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------------
      # 3. Métadonnées : tags + labels OCI
      # --------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aidhabitat-api
          tags: |
            type=raw,value=${{ inputs.image_tag || 'candidate' }}
            type=sha,prefix=${{ inputs.image_tag || 'candidate' }}-,format=long

      # --------------------------------------------------------------
      # 4. Build the image; push only after an explicit manual decision.
      # --------------------------------------------------------------
      # Context = racine du repo (le Dockerfile.api a besoin de server/
      # + shared/ + package*.json). `.dockerignore` racine exclut
      # node_modules, aid_habitat_app/, etc.
      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # --------------------------------------------------------------
      # 5. Trigger redéploiement Easypanel
      # --------------------------------------------------------------
      - name: Trigger Easypanel redeploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_api }}
        env:
          EASYPANEL_WEBHOOK: ${{ secrets.EASYPANEL_API_WEBHOOK }}
        run: |
          echo "Triggering Easypanel redeploy…"
          node tools/release-artifact-check.mjs post-webhook EASYPANEL_WEBHOOK

      - name: Wait for expected API version and readiness
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_api }}
        timeout-minutes: 6
        env:
          API_HEALTH_BASE_URL: ${{ vars.API_HEALTH_BASE_URL || 'https://api.aidhabitat.fr' }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          API_READINESS_TIMEOUT_MS: '300000'
        run: node tools/wait-api-readiness.mjs

      # --------------------------------------------------------------
      # 6. Résumé pour le job log
      # --------------------------------------------------------------
      - name: Summary
        run: |
          echo "## API candidate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image publication requested: \`${{ inputs.publish_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- API deployment requested: \`${{ inputs.deploy_api }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.deploy_api }}" = "true" ]; then
            echo "- Active SHA verified: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Readiness: HTTP 200 with matching SHA" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Active version: not changed or claimed by this run" >> $GITHUB_STEP_SUMMARY
          fi
